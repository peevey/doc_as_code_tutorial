name: Dokumentation veröffentlichen

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Asciidoctor, PDF-Konverter und Rouge installieren
        run: |
          gem install asciidoctor --version 2.0.26 --no-document
          gem install asciidoctor-pdf --version 2.3.24 --no-document
          gem install rouge --version 4.6.1 --no-document

      - name: Website erzeugen
        run: |
          mkdir -p _site/assets/images
          cp -a assets/images/. _site/assets/images/
          asciidoctor --failure-level WARN \
            -a imagesdir=assets/images \
            -a pdf-download=doc_as_code_tutorial.pdf \
            -o _site/index.html \
            pages/00_tutorial_master.adoc
          touch _site/.nojekyll

      - name: PDF erzeugen
        run: bash scripts/build-pdf.sh _site/doc_as_code_tutorial.pdf

      - name: PDF als Build-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: doc_as_code_tutorial-pdf
          path: _site/doc_as_code_tutorial.pdf
          if-no-files-found: error

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
